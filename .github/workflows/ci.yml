name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 app/
      - name: Tests pytest + couverture
        run: pytest --cov=app --cov-report=term-missing
        # Approfondissement : faire échouer si la couverture < seuil
        # run: pytest --cov=app --cov-fail-under=70

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Démarrer le backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python seed.py
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Tests Cypress (headless)
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &
          npx --yes wait-on --timeout 60000 http-get://127.0.0.1:5173 http-get://127.0.0.1:8000/api/v1/health || (echo "backlog: " && cat ../backend/backend.log && echo "frontlog:" && cat frontend.log && exit 1)
          npx cypress run
